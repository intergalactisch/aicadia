<!doctype html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#f8f8f5">
    <title>Aicadia Studio</title>
    <script>
      (() => {
        const key = "aicadia.user_id";
        const uuid = "[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}";
        const match = location.hash.match(new RegExp(`^#user_id=(${uuid})$`, "i"));
        const fragmentUserId = match?.[1].toLowerCase() ?? null;
        try {
          if (fragmentUserId) sessionStorage.setItem(key, fragmentUserId);
        } catch {}
        if (location.hash) history.replaceState(null, "", `${location.pathname}${location.search}`);
        try {
          const stored = sessionStorage.getItem(key);
          window.__aicadiaUserId = stored && new RegExp(`^${uuid}$`, "i").test(stored)
            ? stored
            : fragmentUserId;
        } catch {
          window.__aicadiaUserId = fragmentUserId;
        }
      })();
    </script>
    <link rel="stylesheet" href="/assets/studio.css">
  </head>
  <body>
    <a class="skip-link" href="#studio-content">Skip to content</a>

    <div class="loading-screen" data-loading role="status">
      <div class="loading-mark" aria-hidden="true">A</div>
      <p>Reading the current game and local World.</p>
    </div>

    <div class="studio-app isolate" data-app-shell>
      <header class="app-header">
        <div class="header-start">
          <button
            class="mobile-menu-button"
            type="button"
            data-action="toggle-mobile-nav"
            aria-controls="mobile-navigation"
            aria-expanded="false"
          >
            Menu
          </button>
          <a class="brand" href="/" aria-label="Homepage">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-copy">
              <strong>Aicadia</strong>
              <small>Studio</small>
            </span>
          </a>
        </div>

        <nav class="primary-nav" aria-label="Studio section">
          <a href="/?section=game&amp;view=overview" data-section-link="game">Game</a>
          <a href="/?section=live&amp;view=overview" data-section-link="live">Live</a>
        </nav>

        <div class="header-actions">
          <div class="connection-state" data-state="loading">
            <span class="connection-dot" aria-hidden="true"></span>
            <span data-mount="connection">Reading</span>
          </div>
          <time class="read-time" data-mount="read-time" hidden></time>
          <button class="button button-secondary" type="button" data-action="refresh">Refresh</button>
        </div>
      </header>

      <div class="mobile-navigation" id="mobile-navigation" hidden>
        <div data-mount="mobile-nav"></div>
      </div>

      <div class="app-frame">
        <aside class="sidebar" aria-label="Current section navigation">
          <div class="sidebar-context" data-mount="sidebar-context"></div>
          <nav data-mount="side-nav"></nav>
        </aside>

        <main class="main-content" id="studio-content" tabindex="-1">
          <div data-mount="page"></div>
        </main>
      </div>
    </div>

    <div class="copy-overlay" data-copy-fallback hidden>
      <section
        class="copy-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="copy-fallback-title"
        aria-describedby="copy-fallback-description"
      >
        <div>
          <h2 id="copy-fallback-title">Copy reference</h2>
          <p id="copy-fallback-description">Automatic clipboard access is unavailable. Copy the selected text below.</p>
        </div>
        <pre data-copy-fallback-value tabindex="0" aria-label="Reference to copy"></pre>
        <div class="inline-actions">
          <button class="button button-primary" type="button" data-action="close-copy-fallback">Done</button>
        </div>
      </section>
    </div>

    <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
    <script src="/assets/studio.js" defer></script>
  </body>
</html>
