[package]
name = "aicadia"
version = "0.1.0"
edition = "2024"
default-run = "aicadia"

[dependencies]
axum = "0.8.6"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
rmcp = { version = "=3.1.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = { version = "1.2.2", features = ["chrono04", "uuid1"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
utoipa = { version = "5.5.0", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1.23.4", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
