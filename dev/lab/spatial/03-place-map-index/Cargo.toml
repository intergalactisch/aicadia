[package]
name = "postgres-place-map-index-lab"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

