<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aicadia change-wait lab</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171512; color: #f2eadf; }
      main { width: min(32rem, calc(100vw - 2rem)); padding: 1.5rem; border: 1px solid #5d554a; border-radius: 1rem; background: #24201b; }
      h1 { margin-top: 0; font-size: 1.25rem; }
      dl { display: grid; grid-template-columns: auto 1fr; gap: .5rem 1rem; }
      dt { color: #bfb3a3; }
      dd { margin: 0; }
      [data-status="waiting"] { color: #e8c36a; }
      [data-status="changed"] { color: #75d69c; }
      [data-status="error"] { color: #ff8989; }
    </style>
  </head>
  <body>
    <main>
      <h1>Active client</h1>
      <dl>
        <dt>Status</dt><dd id="status" data-status="starting">starting</dd>
        <dt>Subject</dt><dd id="subject">—</dd>
        <dt>Version</dt><dd id="version">—</dd>
        <dt>Description</dt><dd id="description">—</dd>
      </dl>
    </main>
    <script>
      const status = document.querySelector("#status");
      const subject = document.querySelector("#subject");
      const version = document.querySelector("#version");
      const description = document.querySelector("#description");

      function renderState(state) {
        subject.textContent = state.subject;
        version.textContent = String(state.version);
        description.textContent = state.description;
      }

      async function request(path, options = {}) {
        const response = await fetch(path, options);
        if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
        return response.json();
      }

      async function observeOnce() {
        const initial = await request("/state", { headers: { "x-lab-client": "component" } });
        renderState(initial);
        status.textContent = "waiting";
        status.dataset.status = "waiting";
        const result = await request("/wait", {
          method: "POST",
          headers: { "content-type": "application/json", "x-lab-client": "component" },
          body: JSON.stringify({
            watches: [{ subject: initial.subject, known_version: initial.version }],
            max_wait_ms: 30000
          })
        });
        if (result.timed_out || !result.changed_subjects.includes(initial.subject)) {
          throw new Error("bounded wait ended without the Table change");
        }
        const current = await request("/state", { headers: { "x-lab-client": "component" } });
        renderState(current);
        status.textContent = "changed and reread";
        status.dataset.status = "changed";
      }

      observeOnce().catch((error) => {
        status.textContent = error.message;
        status.dataset.status = "error";
      });
    </script>
  </body>
</html>
