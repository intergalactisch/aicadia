[package]
name = "aicadia-host-independent-change-wait-lab"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
rmcp = { version = "=3.1.1", default-features = false, features = [
    "client",
    "macros",
    "reqwest",
    "schemars",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.53.1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = "0.7.19"

[workspace]
