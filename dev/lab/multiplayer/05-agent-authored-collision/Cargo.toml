[package]
name = "agent-authored-collision-lab"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
axum = "0.8.6"
rmcp = { version = "=3.1.1", default-features = false, features = ["server", "macros", "schemars", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }

