[package]
name = "postgres-mcp-interest-strategies-lab"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
chrono = { version = "0.4.45", features = ["serde"] }
http = "1.4.0"
rmcp = { version = "=3.1.1", default-features = false, features = [
    "client",
    "server",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", default-features = false, features = [
    "chrono",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "uuid",
] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7.18"
uuid = { version = "1.24.1", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
